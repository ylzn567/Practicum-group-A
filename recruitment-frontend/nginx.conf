server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # ייבוא מפ"ל מעלה קובץ עד 5MB (הגבלת הבאקאנד), ובברירת המחדל nginx חוסם מעל 1MB
  client_max_body_size 6m;

  # /api עובר לשירות backend ברשת של compose. הכתובת נפתרת בזמן בקשה (ולא בעליית nginx),
  # כך ש-nginx עולה גם אם הבאקאנד עדיין לא מוכן, ו-127.0.0.11 הוא ה-DNS הפנימי של docker.
  location /api/ {
    resolver 127.0.0.11 valid=10s;
    set $backend http://backend:5000;
    proxy_pass $backend;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 60s;
  }

  # לקבצי assets יש hash בשם, ולכן אפשר לשמור אותם במטמון לתמיד
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # אפליקציית SPA: כל כתובת אחרת (למשל /positions/123/edit) מחזירה את index.html
  location / {
    try_files $uri $uri/ /index.html;
  }
}
